name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py'
      - name: Loop smoke test
        run: python skills/remorsearch-ux-qa/scripts/smoke_loop.py
      - name: Research smoke test
        run: python skills/remorsearch-ux-qa/examples/research/run_fixture.py
      - name: Distribution file check
        run: python scripts/release_files.py

  web-driver:
    name: Web driver selftest on Node 22
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skills/remorsearch-ux-qa/drivers/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/remorsearch-ux-qa/drivers/web/package-lock.json
      - name: Install driver dependencies
        run: npm ci
      - name: Seed and recorder binding regressions on Node 22
        working-directory: .
        run: |
          node --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          PYTHONPATH=tests PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_ergo_seed_bindings test_ergo_profile_binding
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Driver selftest
        run: node selftest.mjs
      - name: Persona benchmark launcher tests
        working-directory: .
        run: node --test benchmarks/persona-effectiveness/tests/runner.test.cjs benchmarks/persona-effectiveness-pe2/tests/runner.test.cjs
      - name: Browser guardrail and bridge unit tests
        working-directory: .
        run: node --test skills/remorsearch-ux-qa/drivers/web/journey_bridge.test.mjs tests/scale_browser_guardrails.test.mjs tests/scale_browser_legacy_seed.test.mjs tests/scale_browser_lifecycle.test.mjs tests/scale_browser_action_deadline.test.mjs tests/scale_browser_scroll.test.mjs
